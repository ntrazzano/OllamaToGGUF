[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-to-gguf"
version = "1.0.0"
description = "Convert Ollama models to GGUF format"
readme = "README.md"
requires-python = ">=3.8"

license = {text = "MIT"}
dependencies = [
    "click>=8.0.0",
]

[project.scripts]
ollama-to-gguf = "main:cli"

[project.optional-dependencies]
dev = [
    "pytest",
]
